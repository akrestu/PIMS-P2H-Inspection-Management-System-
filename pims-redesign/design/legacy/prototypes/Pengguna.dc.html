<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>PIMS — Pengguna & driver</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pims.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="pims" data-theme="{{ theme }}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--background); color: var(--foreground); font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: var(--fs-body); font-weight: var(--fw-body); display: flex; flex-direction: column">

  <header class="blurbar" style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: 6px 8px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: var(--bw) solid var(--border)">
    <div style="display: flex; align-items: center; gap: 4px; height: 52px">
      <sc-if value="{{ notSelecting }}" hint-placeholder-val="{{ true }}">
        <a href="Dashboard.dc.html" class="press hl" aria-label="Kembali" style="width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--foreground)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></a>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 18px; font-weight: 600">Pengguna & driver</span><span class="tnum" style="font-size: 13px; color: var(--muted-foreground)">{{ total }} akun</span></span>
        <button type="button" class="press hl" onClick="{{ importIt }}" aria-label="Import Excel" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--foreground); display: flex; align-items: center; justify-content: center"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg></button>
        <button type="button" class="press" onClick="{{ openAdd }}" style="height: 44px; padding: 0 12px; margin-right: 4px; border: 0; border-radius: 10px; background: var(--primary); color: var(--primary-foreground); font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Akun</button>
      </sc-if>
      <sc-if value="{{ selecting }}" hint-placeholder-val="{{ false }}">
        <button type="button" class="press hl" onClick="{{ exitSelect }}" aria-label="Batal pilih" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--foreground); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        <span class="tnum" style="flex: 1; font-size: 20px; font-weight: 600">{{ selCount }} dipilih</span>
      </sc-if>
    </div>
    <div class="noscroll" style="display: flex; gap: 8px; overflow-x: auto; padding: 0 8px">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
        <button type="button" class="press" aria-pressed="{{ c.on }}" onClick="{{ c.pick }}" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: var(--bw) solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.fg }}; font: inherit; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px">{{ c.label }}<span class="tnum" style="font-weight: 600; opacity: .7">{{ c.n }}</span></button>
      </sc-for>
    </div>
    <div class="field" style="display: flex; align-items: center; gap: 10px; height: 46px; margin: 0 8px; padding: 0 12px; border-radius: 10px; border: var(--bw) solid var(--input); background: var(--background)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted-foreground)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input value="{{ q }}" onChange="{{ onQ }}" aria-label="Cari pengguna" placeholder="Cari nama, NRP, email" style="flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--foreground); font: inherit; font-size: 16px">
    </div>
  </header>

  <div class="noscroll" style="flex: 1; overflow-y: auto; padding: 186px 12px 120px; display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{ rows }}" as="u" hint-placeholder-count="8">
      <button type="button" class="press hl" aria-label="{{ u.aria }}" onPointerDown="{{ u.down }}" onPointerUp="{{ u.up }}" onPointerLeave="{{ u.up }}" onClick="{{ u.click }}" style="display: flex; gap: 12px; align-items: center; padding: 10px 8px; min-height: 68px; border: 0; border-radius: 12px; background: {{ u.bg }}; color: var(--foreground); font: inherit; text-align: left; width: 100%; user-select: none">
        <sc-if value="{{ selecting }}" hint-placeholder-val="{{ false }}">
          <span style="width: 22px; height: 22px; border-radius: 6px; border: 2px solid {{ u.boxBorder }}; background: {{ u.boxBg }}; color: var(--primary-foreground); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{ u.checkOp }}"><path d="M20 6 9 17l-5-5"/></svg></span>
        </sc-if>
        <span style="width: 40px; height: 40px; border-radius: 999px; background: {{ u.avBg }}; color: {{ u.avFg }}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; opacity: {{ u.op }}">{{ u.init }}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; opacity: {{ u.op }}">
          <span style="display: flex; align-items: center; gap: 6px"><strong style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ u.name }}</strong>
            <sc-if value="{{ u.appr }}" hint-placeholder-val="{{ false }}"><span style="flex-shrink: 0; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--muted); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">Approver LV</span></sc-if></span>
          <span class="tnum" style="font-size: 13px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ u.sub }}</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0">
          <span style="font-size: 13px; font-weight: 600">{{ u.role }}</span>
          <sc-if value="{{ u.inactive }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: var(--muted-foreground)">Nonaktif</span></sc-if>
        </span>
      </button>
    </sc-for>
    <span style="padding: 12px 8px; font-size: 13px; color: var(--muted-foreground)">Tekan lama untuk memilih beberapa akun.</span>
  </div>

  <sc-if value="{{ selecting }}" hint-placeholder-val="{{ false }}">
    <div class="toast-in blurbar" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; padding: 12px 12px 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; border-top: var(--bw) solid var(--border)">
      <button type="button" class="press" onClick="{{ bulkExport }}" style="height: 52px; border-radius: 12px; border: var(--bw) solid var(--input); background: var(--background); color: var(--foreground); font: inherit; font-size: 14px; font-weight: 600; opacity: {{ bulkOp }}">Export</button>
      <button type="button" class="press" onClick="{{ bulkDisable }}" style="height: 52px; border-radius: 12px; border: var(--bw) solid var(--input); background: var(--background); color: var(--foreground); font: inherit; font-size: 14px; font-weight: 600; opacity: {{ bulkOp }}">Nonaktifkan</button>
      <button type="button" class="press" onClick="{{ bulkDelete }}" style="height: 52px; border-radius: 12px; border: var(--bw) solid var(--input); background: var(--background); color: var(--danger); font: inherit; font-size: 14px; font-weight: 600; opacity: {{ bulkOp }}"><span class="tnum">Hapus {{ selCount }}</span></button>
    </div>
  </sc-if>

  <sc-if value="{{ sheetOn }}" hint-placeholder-val="{{ false }}">
    <div class="fade" aria-hidden="true" style="position: absolute; inset: 0; z-index: 9; background: var(--scrim)"></div>
    <div role="dialog" aria-modal="true" aria-labelledby="us-t" class="sheet-in" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; max-height: 92%; display: flex; flex-direction: column; background: var(--background); border-radius: 20px 20px 0 0; box-shadow: var(--shadow-3)">
      <div style="height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 40px; height: 5px; border-radius: 5px; background: var(--input)"></span></div>
      <div style="display: flex; align-items: center; padding: 0 8px 8px 20px"><strong id="us-t" style="flex: 1; font-size: 20px; font-weight: 600">{{ sheetTitle }}</strong><button type="button" class="press hl" onClick="{{ closeSheet }}" aria-label="Tutup" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--foreground); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
      <div class="noscroll" style="overflow-y: auto; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 14px">
        <sc-for list="{{ fields }}" as="f" hint-placeholder-count="4">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">{{ f.label }}
            <input type="{{ f.type }}" value="{{ f.value }}" onChange="{{ f.on }}" placeholder="{{ f.ph }}" autocomplete="off" class="field" style="height: 52px; padding: 0 14px; border-radius: 10px; border: var(--bw) solid var(--input); background: var(--background); color: var(--foreground); font: inherit; font-size: 16px; font-weight: 400; outline: 0">
          </label>
        </sc-for>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span id="rl-l" style="font-size: 14px; font-weight: 500">Peran</span>
          <div role="radiogroup" aria-labelledby="rl-l" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: var(--muted)">
            <sc-for list="{{ roleOpts }}" as="o" hint-placeholder-count="3">
              <button type="button" role="radio" aria-checked="{{ o.on }}" class="press" onClick="{{ o.pick }}" style="height: 46px; border: 0; border-radius: 9px; background: {{ o.bg }}; box-shadow: {{ o.shadow }}; color: {{ o.fg }}; font: inherit; font-size: 14px; font-weight: 600">{{ o.label }}</button>
            </sc-for>
          </div>
          <span style="font-size: 13px; line-height: 18px; color: var(--muted-foreground)">{{ roleHint }}</span>
        </div>
        <sc-for list="{{ toggles }}" as="t" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px">
            <span style="display: flex; flex-direction: column; gap: 2px"><span id="{{ t.id }}" style="font-size: 15px; font-weight: 500">{{ t.label }}</span><span style="font-size: 13px; color: var(--muted-foreground)">{{ t.sub }}</span></span>
            <button type="button" role="switch" aria-checked="{{ t.on }}" aria-labelledby="{{ t.id }}" onClick="{{ t.toggle }}" class="press" style="width: 60px; height: 48px; border: 0; padding: 8px 4px; background: transparent; display: flex; align-items: center; flex-shrink: 0"><span style="width: 52px; height: 32px; box-sizing: border-box; border-radius: 999px; padding: 3px; background: {{ t.bg }}; display: flex; align-items: center; transition: background-color 150ms"><span style="width: 26px; height: 26px; border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transform: translateX({{ t.x }}px); transition: transform 220ms cubic-bezier(.34,1.56,.64,1)"></span></span></button>
          </div>
        </sc-for>
        <button type="button" class="press" onClick="{{ save }}" style="height: 56px; border: 0; border-radius: 12px; background: var(--primary); color: var(--primary-foreground); font: inherit; font-size: 16px; font-weight: 600">{{ saveLabel }}</button>
        <sc-if value="{{ isEdit }}" hint-placeholder-val="{{ false }}">
          <button type="button" class="press" onClick="{{ resetPw }}" style="height: 52px; border-radius: 12px; border: var(--bw) solid var(--input); background: var(--background); color: var(--foreground); font: inherit; font-size: 15px; font-weight: 600">Kirim tautan reset kata sandi</button>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}">
    <div role="status" class="toast-in" style="position: absolute; left: 12px; right: 12px; bottom: {{ toastBottom }}px; z-index: 22; min-height: 52px; padding: 6px 6px 6px 16px; border-radius: 14px; background: #0A0A0A; color: #FAFAFA; display: flex; align-items: center; gap: 10px; font-size: 15px; box-shadow: var(--shadow-3)">
      <span style="flex: 1">{{ toastText }}</span>
      <sc-if value="{{ toastUndo }}" hint-placeholder-val="{{ false }}"><button type="button" class="press" onClick="{{ doUndo }}" style="height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #F4D435; font: inherit; font-size: 15px; font-weight: 600">Urungkan</button></sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark","hc"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const P = (id, name, role, site, nrp, email, appr, active) => ({ id, name, role, site, nrp, email, appr: !!appr, active: active !== false });
    this.state = {
      users: [
        P(1, 'Rina Anggraini', 'Admin', 'Semua site', '', 'rina.a@kontraktor.co.id', false), P(2, 'Hendra Wijaya', 'Manager', 'Pit A', '', 'hendra.w@kontraktor.co.id', true),
        P(3, 'Wawan Setiadi', 'Manager', 'Pit A, Pit B', '', 'wawan.s@kontraktor.co.id', true), P(4, 'Budi Santoso', 'Driver', 'Pit A', '20231045', '', false),
        P(5, 'Andi Pratama', 'Driver', 'Pit A', '20220871', '', false), P(6, 'Dedi Kurniawan', 'Driver', 'Pit A', '20210533', '', false),
        P(7, 'Sari Maharani', 'Driver', 'Pit B', '20240112', '', false), P(8, 'Rudi Hartono', 'Driver', 'Pit A', '20200987', '', false, false),
        P(9, 'Joko Widodo S.', 'Driver', 'Pit A', '20230440', '', false), P(10, 'Fajar Nugroho', 'Driver', 'Pit B', '20240321', '', false)
      ],
      filter: 'semua', q: '', selecting: false, sel: {}, sheet: null, editId: null, form: {}, toast: null
    };
  }
  componentWillUnmount() { clearTimeout(this.lp); clearTimeout(this.tt); }
  buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
  toast(text, undo) { clearTimeout(this.tt); this.setState({ toast: { text, undo } }); this.tt = setTimeout(() => this.setState({ toast: null }), undo ? 5000 : 2600); }
  renderVals() {
    const s = this.state;
    const theme = this.props.theme ?? 'light';
    const all = s.users;
    const n = (r) => all.filter((u) => u.role === r).length;
    const chips = [['semua', 'Semua', all.length], ['Admin', 'Admin', n('Admin')], ['Manager', 'Manager', n('Manager')], ['Driver', 'Driver', n('Driver')]].map(([k, label, c]) => { const on = s.filter === k; return { label, n: c, on, bg: on ? 'var(--primary)' : 'var(--background)', fg: on ? 'var(--primary-foreground)' : 'var(--foreground)', border: on ? 'var(--primary)' : 'var(--input)', pick: () => this.setState({ filter: k }) }; });
    const q = s.q.trim().toLowerCase();
    const list = all.filter((u) => (s.filter === 'semua' || u.role === s.filter) && (!q || (u.name + u.nrp + u.email).toLowerCase().includes(q)));
    const AV = { Admin: ['#0A0A0A', '#FAFAFA'], Manager: ['#FEF9DB', '#7A5312'], Driver: ['var(--muted)', 'var(--foreground)'] };
    const selIds = Object.keys(s.sel).filter((k) => s.sel[k]);
    const rows = list.map((u) => {
      const sel = !!s.sel[u.id];
      return { ...u, init: u.name.split(' ').map((x) => x[0]).slice(0, 2).join(''), avBg: AV[u.role][0], avFg: AV[u.role][1], op: u.active ? 1 : 0.5, inactive: !u.active,
        sub: (u.nrp ? 'NRP ' + u.nrp : u.email) + ' · ' + u.site, aria: u.name + ', ' + u.role + ', ' + u.site + (u.active ? '' : ', nonaktif'),
        bg: sel ? 'var(--brand-soft)' : 'transparent', boxBorder: sel ? 'var(--foreground)' : 'var(--input)', boxBg: sel ? 'var(--foreground)' : 'transparent', checkOp: sel ? 1 : 0,
        down: () => { this.lpf = false; clearTimeout(this.lp); this.lp = setTimeout(() => { this.lpf = true; this.buzz(15); this.setState({ selecting: true, sel: { ...this.state.sel, [u.id]: true } }); }, 450); },
        up: () => clearTimeout(this.lp),
        click: () => { if (this.lpf) { this.lpf = false; return; } if (this.state.selecting) { this.setState({ sel: { ...this.state.sel, [u.id]: !this.state.sel[u.id] } }); return; } this.setState({ sheet: 'edit', editId: u.id, form: { ...u } }); } };
    });
    const F = s.form || {};
    const setF = (k) => (e) => this.setState({ form: { ...this.state.form, [k]: e.target.value } });
    const fields = [['name', 'Nama lengkap', 'text', 'Nama sesuai ID karyawan'], ['nrp', 'NRP', 'text', 'Wajib untuk driver'], ['email', 'Email', 'email', 'Wajib untuk Admin/Manager'], ['site', 'Site', 'text', 'Pit A']].map(([k, label, type, ph]) => ({ label, type, ph, value: F[k] || '', on: setF(k) }));
    const roleOpts = ['Driver', 'Manager', 'Admin'].map((r) => ({ label: r, on: F.role === r, bg: F.role === r ? 'var(--card)' : 'transparent', shadow: F.role === r ? 'var(--shadow-2)' : 'none', fg: F.role === r ? 'var(--foreground)' : 'var(--muted-foreground)', pick: () => this.setState({ form: { ...this.state.form, role: r } }) }));
    const RH = { Driver: 'Mengisi P2H, melihat riwayat & temuan unitnya. Login dengan NRP.', Manager: 'Monitoring, persetujuan, laporan, master data tanpa hapus permanen.', Admin: 'Semua fitur termasuk audit log, pengaturan, dan hapus permanen.' };
    const tg = (id, key, label, sub) => ({ id, label, sub, on: !!F[key], bg: F[key] ? 'var(--success)' : 'var(--input)', x: F[key] ? 20 : 0, toggle: () => this.setState({ form: { ...this.state.form, [key]: !this.state.form[key] } }) });
    const toggles = [tg('tg-a', 'appr', 'Approver P2H LV', 'Menerima permintaan persetujuan light vehicle'), tg('tg-b', 'active', 'Akun aktif', 'Nonaktif = tidak bisa login, data tetap ada')];
    const toastOn = !!s.toast;
    return {
      theme, total: all.length, chips, rows, q: s.q, onQ: (e) => this.setState({ q: e.target.value }),
      selecting: s.selecting, notSelecting: !s.selecting, selCount: selIds.length, bulkOp: selIds.length ? 1 : 0.4,
      exitSelect: () => this.setState({ selecting: false, sel: {} }),
      bulkExport: () => this.toast('Export ' + selIds.length + ' akun ke Excel'),
      bulkDisable: () => { const prev = s.users; this.setState({ users: prev.map((u) => s.sel[u.id] ? { ...u, active: false } : u), selecting: false, sel: {} }); this.toast(selIds.length + ' akun dinonaktifkan', () => this.setState({ users: prev })); },
      bulkDelete: () => { if (!selIds.length) return; const prev = s.users; this.setState({ users: prev.filter((u) => !s.sel[u.id]), selecting: false, sel: {} }); this.toast(selIds.length + ' akun dipindah ke Sampah', () => this.setState({ users: prev })); },
      importIt: () => this.toast('Import akun: pola sama dengan Master unit (template → validasi → impor)'),
      openAdd: () => this.setState({ sheet: 'add', editId: null, form: { role: 'Driver', site: 'Pit A', active: true } }),
      sheetOn: !!s.sheet, isEdit: s.sheet === 'edit', sheetTitle: s.sheet === 'edit' ? 'Ubah akun' : 'Tambah akun', closeSheet: () => this.setState({ sheet: null }),
      fields, roleOpts, roleHint: RH[F.role] || '', toggles, saveLabel: s.sheet === 'edit' ? 'Simpan' : 'Buat akun & kirim undangan',
      save: () => {
        if (!F.name) { this.buzz([20, 40, 20]); this.toast('Nama wajib diisi'); return; }
        const prev = s.users;
        const users = s.sheet === 'edit' ? prev.map((u) => u.id === s.editId ? { ...u, ...F } : u) : [{ id: Date.now(), nrp: '', email: '', appr: false, ...F }].concat(prev);
        this.setState({ users, sheet: null });
        this.toast(s.sheet === 'edit' ? 'Akun ' + F.name + ' disimpan' : 'Undangan dikirim ke ' + F.name, () => this.setState({ users: prev }));
      },
      resetPw: () => { this.setState({ sheet: null }); this.toast('Tautan reset dikirim ke ' + (F.email || 'nomor WhatsApp driver')); },
      toastOn, toastText: toastOn ? s.toast.text : '', toastUndo: toastOn && !!s.toast.undo, toastBottom: s.selecting ? 100 : 24,
      doUndo: () => { const u = s.toast && s.toast.undo; clearTimeout(this.tt); this.setState({ toast: null }); if (u) u(); }
    };
  }
}
</script>
</body>
</html>
