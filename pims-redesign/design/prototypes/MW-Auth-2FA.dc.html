<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>PIMS × MyWahana — 2FA</title><script src="./support.js"></script><link rel="stylesheet" href="./mw.css"></head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div style="width: 390px; height: 844px">
  <dc-import name="MW-Auth" start="2FA" theme="{{ theme }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return { theme: this.props.theme ?? 'light' }; } }
</script>
</body>
</html>
